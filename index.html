<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Instagram Reveal Game</title>
        <style>
            :root {
                --bg-primary: #f8fafc;
                --text-main: #1e293b;
                --card-bg: #ffffff;
                --border-color: #e2e8f0;
                --primary-accent: #4f46e5;
                --success-btn: #10b981;
                --success-hover: #059669;
                --disabled-btn: #cbd5e1;
            }

            body {
                background-color: var(--bg-primary);
                color: var(--text-main);
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                margin: 0;
                padding: 40px 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                box-sizing: border-box;
            }

            .main-container {
                width: 100%;
                max-width: 650px;
                display: flex;
                flex-direction: column;
                gap: 24px;
            }

            .switcher-wrapper {
                display: flex;
                justify-content: flex-end;
                width: 100%;
            }
            #language-switcher {
                padding: 8px 14px;
                border-radius: 8px;
                border: 1px solid var(--border-color);
                background-color: var(--card-bg);
                color: var(--text-main);
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                outline: none;
                box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            }

            .card {
                background: var(--card-bg);
                border: 1px solid var(--border-color);
                border-radius: 16px;
                padding: 28px;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
                box-sizing: border-box;
                width: 100%;
            }

            #requirements, #next-steps {
                text-align: initial;
            }

            h1 { font-size: 28px; font-weight: 800; margin-top: 0; margin-bottom: 8px; color: #0f172a; }
            h2 { font-size: 20px; font-weight: 600; margin: 6px 0; color: #475569; }
            h3 { font-size: 18px; font-weight: 700; margin-top: 0; margin-bottom: 16px; color: #0f172a; }
            p { font-size: 15px; line-height: 1.6; color: #334155; margin: 12px 0; }

            .highlight { font-style: italic; font-weight: bold; color: var(--primary-accent); }
            .heavy { font-weight: 800; color: #ef4444; text-decoration: underline; }
            
            :lang(ar) .highlight { font-style: normal; color: #f59e0b; }
            :lang(ar) .heavy { font-weight: 900; color: #dc2626; }

            .link-badge {
                display: inline-block;
                padding: 5px 12px;
                margin: 2px 4px;
                font-size: 13px;
                font-weight: 600;
                text-decoration: none;
                color: #ffffff !important;
                border-radius: 6px;
                transition: transform 0.2s, filter 0.2s;
                vertical-align: middle;
            }
            .link-badge:hover {
                transform: translateY(-1px);
                filter: brightness(95%);
            }
            .instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
            .video { background-color: #0f172a; }
            .kofi { background-color: #ff5e5b; }
            .habitflow { background-color: #3b82f6; }

            ul { list-style-type: none; padding: 0; margin: 0; }
            ul li {
                position: relative;
                padding-inline-start: 24px;
                margin-bottom: 14px;
                font-size: 15px;
                line-height: 1.6;
                color: #334155;
            }
            ul li::before {
                content: "✓";
                position: absolute;
                left: 0;
                color: var(--success-btn);
                font-weight: bold;
            }
            :lang(ar) ul li::before {
                left: auto;
                right: 0;
            }

            .checkbox-container {
                margin-top: 24px;
                padding-top: 18px;
                border-top: 1px dashed var(--border-color);
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .checkbox-container input {
                width: 20px;
                height: 20px;
                accent-color: var(--primary-accent);
                cursor: pointer;
            }
            .checkbox-container label {
                font-size: 15px;
                font-weight: 600;
                color: #1e293b;
                cursor: pointer;
                user-select: none;
            }

            .box-wrapper {
                display: flex;
                justify-content: center;
                gap: 8px;
                margin-top: 16px;
                flex-wrap: wrap;
            }
            span.box {
                font-size: 22px;
                font-weight: 700;
                min-width: 48px;
                height: 48px;
                line-height: 44px;
                border: 2px solid #0f172a;
                text-align: center;
                display: inline-block;
                background-color: #f1f5f9;
                border-radius: 10px;
                box-sizing: border-box;
                box-shadow: inset 0 -2px 0 rgba(0,0,0,0.1);
            }
            #hidding-content { display: none; }

            #reveal-btn, #reveal-secret-btn {
                padding: 12px 28px;
                font-size: 15px;
                font-weight: 700;
                cursor: not-allowed;
                background-color: var(--disabled-btn);
                color: #64748b;
                border: none;
                border-radius: 10px;
                transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            }
            #reveal-btn:not([disabled]) {
                cursor: pointer;
                background-color: var(--success-btn);
                color: white;
                box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
            }
            #reveal-btn:not([disabled]):hover {
                background-color: var(--success-hover);
                transform: translateY(-1px);
            }

            #reveal-secret-btn {
                cursor: pointer;
                background-color: #475569;
                color: white;
                width: 100%;
                margin-top: 16px;
            }
            #reveal-secret-btn:hover {
                background-color: #334155;
            }
            #reveal-secret-btn.revealed {
                background-color: #fef3c7;
                color: #b45309;
                border: 2px dashed #f59e0b;
                cursor: default;
                font-size: 15px;
                padding: 16px;
                box-shadow: none;
            }

            #next-steps div p {
                margin-bottom: 12px;
                font-size: 15px;
                border-bottom: 1px solid #f1f5f9;
                padding-bottom: 10px;
            }
            #next-steps div p:last-child {
                border-bottom: none;
            }
        </style>
        <script defer src="https://cloud.umami.is/script.js" data-website-id="bc6e9193-2734-402d-8d8f-b336a22b0d8c"></script>
    </head>
    <body>

        <div class="main-container">
            
            <div class="switcher-wrapper">
                <select id="language-switcher">
                    <option value="en" data-umami-event="language" data-umami-value="English">English</option>
                    <option value="ar" data-umami-event="language" data-umami-value="العربية">العربية</option>
                    <option value="fr" data-umami-event="language" data-umami-value="Français">Français</option>
                </select>
            </div>

            <div id="requirements" class="card">
                <h3 data-translate="text7"></h3>
                <ul style="margin-inline-start: 0;">
                    <li data-translate="requirement1"></li>
                    <li data-translate="requirement2"></li>
                </ul>
                <div class="checkbox-container" data-umami-event="agree">
                    <input type="checkbox" id="agree">
                    <label for="agree" data-translate="agreeText"></label>
                </div>
            </div>

            <div class="card header-section">
                <h1 data-translate="text1"></h1>
                <h2 data-translate="text2"></h2>
                <h2 data-translate="text3"></h2>
                <p data-translate="text4"></p>
                <h3 data-translate="text5" style="margin-top: 24px; margin-bottom: 12px;"></h3>
                
                <div class="content-wrapper" style="margin-top: 20px;">
                    <p><span data-translate="text6"></span></p>
                    <div id="numbers" style="margin-top: 15px;">
                        <button id="reveal-btn" data-translate="revealButton" data-umami-event="reveal-numbers" disabled></button>
                        <div id="hidding-content" class="box-wrapper">
                            <span class="box">1</span><span class="box">4</span><span class="box">7</span><span class="box">10</span><span class="box">13</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="next-steps" class="card">
                <h3 data-translate="nextTitle"></h3>
                <div>
                    <p data-translate="step1"></p>
                    <p data-translate="step2"></p>
                    <p data-translate="step3"></p>
                    <p data-translate="step4"></p>
                    <p data-translate="step5"></p>
                    <p data-translate="step6"></p>
                    <p data-translate="step7"></p>
                    <p data-translate="step8"></p>
                </div>
                <button id="reveal-secret-btn" data-translate="revealSecretButton" data-umami-event="reveal-secret-instruction"></button>
            </div>

        </div>

        <script>
            const agreeCheckbox = document.getElementById('agree');
            const revealBtn = document.getElementById('reveal-btn');
            const secretData = document.getElementById('hidding-content');
            const langSwitcher = document.getElementById('language-switcher');
            const secretRevealBtn = document.getElementById('reveal-secret-btn');

            let allTranslations = {};

            agreeCheckbox.addEventListener('change', () => {
                revealBtn.disabled = !agreeCheckbox.checked;
            });

            // Main Reveal Engine
            revealBtn.addEventListener('click', () => {
                const activeLang = langSwitcher.value;

                if (localStorage.getItem('ohYouCaughMe')) {
                    const alertMsg = allTranslations[activeLang]?.["alreadyRevealedAlert"] || "You have already revealed the numbers or the hidden instructions!";
                    alert(alertMsg);
                    
                    const consoleMsg = allTranslations[activeLang]?.["consoleHint"] || "Check the source code.";
                    const rtlMarker = (activeLang === 'ar') ? '\u200F' : '';
                    console.log(`%c${rtlMarker}${consoleMsg}`, "color: green; font-size: 16px; font-weight: bold;");
                    return;
                }
                
                secretData.style.display = 'flex';
                revealBtn.style.display = 'none';
                localStorage.setItem('ohYouCaughMe', 'true');
            });

            // Verification Code Button Engine
            secretRevealBtn.addEventListener('click', () => {
                const activeLang = langSwitcher.value;
                
                localStorage.setItem('ohYouCaughMe', 'true');
                
                secretRevealBtn.className = "revealed";
                secretRevealBtn.setAttribute('data-translate', 'secretInstructionText');
                
                if (allTranslations[activeLang] && allTranslations[activeLang]['secretInstructionText']) {
                    secretRevealBtn.innerHTML = allTranslations[activeLang]['secretInstructionText'];
                }
            });
            
            async function initTranslator() {
              try {
                const response = await fetch('translations.json');
                allTranslations = await response.json();
                setLanguage('en');
              } catch (error) {
                console.error("Error loading the translations JSON:", error);
              }
            }
            
            function setLanguage(lang) {
              document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
              document.documentElement.lang = lang;

              const elements = document.querySelectorAll('[data-translate]');
            
              elements.forEach(element => {
                const key = element.getAttribute('data-translate');
                if (allTranslations[lang] && allTranslations[lang][key]) {
                  element.innerHTML = allTranslations[lang][key];
                }
              });
            }
            
            langSwitcher.addEventListener('change', (e) => {
              setLanguage(e.target.value);
            });
            
            initTranslator();
        </script>
    </body> 
</html>
